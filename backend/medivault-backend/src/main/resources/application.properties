spring.application.name=medivault-backend
server.port=${PORT:8085}

# In-memory H2 configuration for development & evaluation
spring.datasource.url=jdbc:h2:mem:medivaultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.com.medivault=INFO
logging.level.org.springframework.web=INFO
